services:
  db:
    image: postgres:18.4
    container_name: tsa_db
    env_file: .env
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: tsa-local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsa_backend
    ports:
      - '8020:8000'
    networks:
      - tsa-network
    env_file: .env
    volumes:
      - ./src/staticfiles:/app/src/staticfiles
      - ./src/media:/app/src/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  tsa-network:
    driver: bridge
