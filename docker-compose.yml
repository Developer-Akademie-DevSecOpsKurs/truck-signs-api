services:
  db:
    image: postgres:16-alpine
    container_name: tsa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: ${BACKEND_IMAGE:-vadimcebanu/truck-signs-api:latest}
    container_name: tsa_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - '8020:8020'
    environment:
      MODE: prod
      DEBUG_ENABLED: 'False'
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - static_data:/app/src/staticfiles
      - media_data:/app/src/mediafiles
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data: