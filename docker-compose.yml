
services:
  db:
    # Use a valid PostgreSQL image version.
    image: postgres:15-alpine
    container_name: tsa_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    # Keep the database accessible only through the Docker network.
    networks:
      - tsa-network

    # Persist database data across container restarts.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Check wheter PostgreSQL is ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Use the prebuilt image from Github Container Registry.
    image: ${BACKEND_IMAGE}
    container_name: tsa_backend
    restart: unless-stopped

    environment:
      MODE: ${MODE}
      DEBUG_ENABLED: ${DEBUG_ENABLED}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}

    # Expose the API on port 8020 of the host.
    ports:
      - "${HOST_PORT}:8000"

    networks:
      - tsa-network

    # Start the backend only after PostgreSQL is healthy.
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Named volume for persistent PostgreSQL data.
  postgres_data:

networks:
  # Shared private network for the application and database.
  tsa-network:
    driver: bridge
