# Build and publish the docker image to the Github Container Register
name: Build Application

# Start the workflow whenever code is pushed to the feature/ts-api branch
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# Grant permission to pubish packages to GHCR
permissions:

  # Allow the workflow to read the repository contents
  contents: read

  # Allow the workflow to push Docker images to GitHub Container Registry
  packages: write

# Definition of the workflow jobs
jobs:

  # Job responsible for building and pushing the Docker images
  build_and_push:

    # Run the job on a GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Steps executed during the build job
    steps:

      # Check out the repository on the GitHub runner
      - name: Checkout Repository
        uses: actions/checkout@v6
    
      # Authenticate with GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up QEMU for multi-plattform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Build and publish the image with  a stable and a version tag.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.IMAGE_NAME }}:latest
            ${{ vars.IMAGE_NAME }}:${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
    